# Blame: who changed each line and when, from rhun's Git data (protocol 1.1: git-data,
# decorations). Written in Rust with rhun-ext.
name = blame
owner = rhun-editor
title = Blame
description = Who changed each line and when: at the cursor, on hover, and the history of a file or of lines.
icon = icon.png
color = #b0703a
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/blame-linux-x86_64
run.macos-arm64 = bin/blame-macos-arm64
run.windows-x64 = bin/blame-windows-x64.exe
on = open:*

[provides]
hover = *

[commands]
file_history = Show File History
line_history = Show Line History
open_commit = Open the Line's Commit
toggle = Toggle Inline Blame

[menu.editor]
line_history.group = 7_blame
open_commit.group = 7_blame

[settings]
inline.type = bool
inline.default = yes
inline.title = Inline blame
inline.description = The author and age of the cursor's line after its text and in the status bar

[subscribe]
opened = *
changed = *
cursor = *
selection = *
hover = *

[needs]
documents = read
git = read
project = read
run = git
